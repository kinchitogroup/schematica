name: CI/CD Pipeline

on:
  push:
    branches: [develop, staging, main]

jobs:
  # ─── CI Checks (runs on all branches) ─────────────────────────
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Svelte sync
        run: npx svelte-kit sync

      - name: Type check
        run: npm run check

      - name: Build
        run: npm run build

  # ─── Auto-merge develop → staging ─────────────────────────────
  promote-to-staging:
    needs: check
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.JKP_CI_APP_ID }}
          private-key: ${{ secrets.JKP_CI_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Fast-forward staging to develop
        run: |
          git fetch origin staging
          git checkout staging
          git merge --ff-only origin/develop
          git push origin staging

  # ─── Deploy to Staging ─────────────────────────────────────────
  deploy-staging:
    needs: check
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Pages (staging)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .svelte-kit/cloudflare --project-name=schematica-staging

  # ─── Production Checks ─────────────────────────────────────────
  check-production:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Svelte sync
        run: npx svelte-kit sync

      - name: Type check
        run: npm run check

      - name: Build
        run: npm run build

  # ─── Deploy to Production ──────────────────────────────────────
  deploy-production:
    needs: check-production
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Pages (production)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .svelte-kit/cloudflare --project-name=schematica
